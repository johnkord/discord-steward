name: ci

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        shell: bash
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          echo "GITLEAKS_BIN=${PWD}/gitleaks" >> "$GITHUB_ENV"
      - name: Audit public repository
        run: scripts/audit-public-repo.sh
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet restore DiscordSteward.sln --locked-mode
      - run: dotnet list DiscordSteward.sln package --vulnerable --include-transitive --no-restore
      - run: dotnet build DiscordSteward.sln --no-restore
      - run: dotnet test DiscordSteward.sln --no-build